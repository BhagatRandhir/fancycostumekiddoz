<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Costume for Kiddoz — Costume Rental for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green:       #2b5e2e;
  --green-mid:   #3a7a3e;
  --green-light: #4e9e52;
  --green-pale:  #e8f5e8;
  --mint:        #b2dfdb;
  --mint-bg:     #e0f5f0;
  --white:       #ffffff;
  --off-white:   #f7fdf7;
  --orange:      #f4a020;
  --orange-deep: #d4880a;
  --text:        #1e3a1a;
  --text-mid:    #3a5a30;
  --text-muted:  #6a8a60;
  --border:      #c0d8c0;
  --red-fun:     #e84040;
  --card-shadow: 0 4px 20px rgba(43,94,46,0.12);
  --card-hover:  0 12px 36px rgba(43,94,46,0.22);
  --font-head:   'Baloo 2', cursive;
  --font-body:   'Nunito', sans-serif;
  --radius:      16px;
  --radius-sm:   8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--off-white);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.65;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--green-pale)}
::-webkit-scrollbar-thumb{background:var(--green-mid);border-radius:3px}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  height:70px;padding:0 28px;
  background:var(--green);
  box-shadow:0 2px 16px rgba(43,94,46,0.3);
}
.nav-logo{display:flex;align-items:center;cursor:pointer;padding:4px 0}
.nav-logo img{height:50px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.25))}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{
  font-family:var(--font-body);font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.8);text-decoration:none;
  padding:7px 13px;border-radius:20px;transition:all 0.2s;cursor:pointer
}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,0.18);color:#fff}
.nav-right{display:flex;align-items:center;gap:8px}

/* Nav search */
.nav-search{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);
  border-radius:24px;padding:0 14px;height:36px;width:190px;transition:all 0.3s;
}
.nav-search:focus-within{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.5);width:220px}
.nav-search input{background:none;border:none;outline:none;color:#fff;font-family:var(--font-body);font-size:13px;font-weight:600;width:100%}
.nav-search input::placeholder{color:rgba(255,255,255,0.5)}
.nav-search .si{color:rgba(255,255,255,0.6);margin-right:7px;font-size:14px}

/* Nav user buttons */
.nav-user-area{display:flex;align-items:center;gap:7px}
.btn-nav{
  font-family:var(--font-body);font-size:12px;font-weight:800;
  border:none;padding:8px 16px;border-radius:20px;cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.btn-login{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.35)}
.btn-login:hover{background:rgba(255,255,255,0.25)}
.btn-register{background:var(--orange);color:var(--green)}
.btn-register:hover{background:var(--orange-deep);transform:translateY(-1px)}
.btn-admin{background:rgba(244,160,32,0.2);color:var(--orange);border:1.5px solid rgba(244,160,32,0.4)}
.btn-admin:hover{background:rgba(244,160,32,0.35)}

/* User greeting pill */
.user-greeting{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.12);border-radius:20px;padding:5px 14px 5px 8px;
}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--green)}
.user-greeting span{font-family:var(--font-body);font-size:12px;font-weight:700;color:rgba(255,255,255,0.9)}

/* ── PAGES ── */
.page{display:none;padding-top:70px;min-height:100vh}
.page.active{display:block}

/* ── HERO ── */
.hero{
  background:var(--green);position:relative;overflow:hidden;
  padding:60px 52px 0;min-height:480px;display:flex;align-items:flex-start;
}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.05) 2px,transparent 2px);background-size:34px 34px}
.hero-content{position:relative;z-index:2;max-width:560px;padding-bottom:48px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(244,160,32,0.2);border:1.5px solid rgba(244,160,32,0.45);border-radius:20px;padding:5px 15px;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:1px;color:var(--orange);text-transform:uppercase;margin-bottom:20px}
.hero-title{font-family:var(--font-head);font-size:clamp(36px,5vw,64px);font-weight:800;color:#fff;line-height:1.1;margin-bottom:18px}
.hero-title .accent{color:var(--orange)}
.hero-sub{font-size:16px;color:rgba(255,255,255,0.62);max-width:440px;margin-bottom:28px}

/* BUTTONS */
.btn-primary{font-family:var(--font-body);font-size:13px;font-weight:800;color:var(--green);background:var(--orange);border:none;padding:13px 26px;border-radius:30px;cursor:pointer;transition:all 0.25s;box-shadow:0 4px 12px rgba(244,160,32,0.4);display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{background:var(--orange-deep);transform:translateY(-2px)}

/* SECTION */
.section{padding:50px 48px}
.section-header{text-align:center;margin-bottom:36px}
.section-eyebrow{display:inline-block;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange-deep);background:rgba(244,160,32,0.1);border-radius:20px;padding:5px 14px;margin-bottom:12px}
.section-title{font-family:var(--font-head);font-size:clamp(24px,3.5vw,40px);font-weight:800;color:var(--green);margin-bottom:8px}

/* SEARCH BAR (inline) */
.search-bar-wrap{display:flex;justify-content:center;margin-bottom:32px}
.search-bar{display:flex;align-items:center;background:#fff;border:2px solid var(--border);border-radius:40px;padding:0 20px;height:48px;width:100%;max-width:500px;box-shadow:0 2px 10px rgba(43,94,46,0.09);transition:all 0.3s}
.search-bar:focus-within{border-color:var(--green-mid);box-shadow:0 4px 18px rgba(43,94,46,0.16)}
.search-bar input{background:none;border:none;outline:none;flex:1;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text)}

/* CAT PILLS */
.cat-filter{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-bottom:32px}
.cat-pill{font-family:var(--font-body);font-size:12px;font-weight:700;padding:7px 17px;border-radius:20px;border:2px solid var(--border);background:#fff;color:var(--text-mid);cursor:pointer;transition:all 0.2s}
.cat-pill:hover,.cat-pill.active{background:var(--green);border-color:var(--green);color:#fff}

/* ── UPDATED: COSTUME GRID & CARDS (Strict 4 items per row + Larger Size) ── */
.costume-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* Exactly 4 columns per row */
  gap: 28px;
}

/* Responsive fallback for smaller screens */
@media (max-width: 1200px) {
  .costume-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 850px) {
  .costume-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 540px) {
  .costume-grid { grid-template-columns: 1fr; }
}

.costume-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);transition:all 0.3s;border:1.5px solid transparent;display:flex;flex-direction:column}
.costume-card:hover{transform:translateY(-5px);box-shadow:var(--card-hover);border-color:var(--border)}

/* Increased image aspect ratio (120% padding creates larger height) */
.costume-img-wrap{position:relative;padding-bottom:120%;background:var(--green-pale);overflow:hidden}
.costume-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.costume-card:hover .costume-img-wrap img{transform:scale(1.05)}
.costume-cat-tag{position:absolute;top:12px;left:12px;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--green-light);padding:4px 12px;border-radius:10px;z-index:2}

.costume-info{padding:18px 20px 20px;display:flex;flex-direction:column;flex-grow:1;justify-content:space-between}
.costume-name{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--green);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.costume-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.availability-badge{font-family:var(--font-body);font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px}
.badge-available{background:rgba(45,186,113,0.1);color:#1a9454;border:1.5px solid rgba(45,186,113,0.3)}
.badge-unavailable{background:rgba(232,64,64,0.09);color:#c02828;border:1.5px solid rgba(232,64,64,0.28)}
.costume-price{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--green)}

/* WhatsApp Button */
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 0;background:#25D366;color:#fff;border:none;border-radius:30px;font-family:var(--font-body);font-size:13px;font-weight:800;cursor:pointer;transition:all 0.25s;text-decoration:none}
.wa-btn:hover{background:#1ebe5d;transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,211,102,0.4)}
.wa-btn svg{flex-shrink:0}

/* ── NEW: PAGINATION STYLES ── */
.pagination-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 48px;
}
.page-btn {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  min-width: 40px;
  height: 40px;
  padding: 0 12px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--text-mid);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-btn:hover:not(:disabled) {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-pale);
}
.page-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* FOOTER */
footer{background:var(--green);padding:40px 52px 20px;margin-top:60px;color:#fff;text-align:center}
footer p{font-size:13px;color:rgba(255,255,255,0.6)}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <h2 style="color: #fff; font-family: var(--font-head);">Kiddoz Costumes</h2>
  </div>
  <div class="nav-right">
    <div class="nav-search">
      <span class="si">🔍</span>
      <input type="text" id="searchInput" placeholder="Search costumes...">
    </div>
  </div>
</nav>

<main class="page active">
  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge">✨ Magic & Fun Rentals</span>
      <h1 class="hero-title">Bring Magic to Every <span class="accent">Party!</span></h1>
      <p class="hero-sub">Explore our amazing collection of premium kid costumes for rental.</p>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <span class="section-eyebrow">Explore Collection</span>
      <h2 class="section-title">Rent Costume For Kids</h2>
    </div>

    <!-- Category Filters -->
    <div class="cat-filter" id="catFilter">
      <button class="cat-pill active" data-category="all">All</button>
      <button class="cat-pill" data-category="Superheroes">Superheroes</button>
      <button class="cat-pill" data-category="Fairytale">Fairytale</button>
      <button class="cat-pill" data-category="Animals">Animals</button>
      <button class="cat-pill" data-category="Profession">Profession</button>
    </div>

    <!-- Costume Grid (Strict 4 items per row) -->
    <div class="costume-grid" id="costumeGrid"></div>

    <!-- Pagination Controls -->
    <div class="pagination-container" id="paginationControls"></div>
  </section>
</main>

<footer>
  <p>© 2026 Fancy Costume for Kiddoz. All Rights Reserved.</p>
</footer>

<script>
// Mock data set (25 sample items to demonstrate 20 items per page pagination)
const costumeData = Array.from({ length: 45 }, (_, i) => {
  const categories = ['Superheroes', 'Fairytale', 'Animals', 'Profession'];
  const category = categories[i % categories.length];
  const id = i + 1;
  return {
    id: id,
    name: `${category} Costume #${id}`,
    category: category,
    price: `₹${399 + (i % 5) * 100} / day`,
    available: i % 4 !== 0,
    image: `https://picsum.photos/seed/${id + 100}/400/500`
  };
});

// Configs
const ITEMS_PER_PAGE = 20;
let currentPage = 1;
let filteredItems = [...costumeData];

// DOM Selectors
const grid = document.getElementById('costumeGrid');
const pagination = document.getElementById('paginationControls');
const searchInput = document.getElementById('searchInput');
const catFilter = document.getElementById('catFilter');

// Function to Render Cards
function renderCostumes() {
  grid.innerHTML = '';
  
  const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
  const endIndex = startIndex + ITEMS_PER_PAGE;
  const pageItems = filteredItems.slice(startIndex, endIndex);

  if (pageItems.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No costumes found matching your criteria.</div>';
    return;
  }

  pageItems.forEach(item => {
    const card = document.createElement('div');
    card.className = 'costume-card';
    card.innerHTML = `
      <div class="costume-img-wrap">
        <span class="costume-cat-tag">${item.category}</span>
        <img src="${item.image}" alt="${item.name}" loading="lazy">
      </div>
      <div class="costume-info">
        <div>
          <h3 class="costume-name">${item.name}</h3>
          <div class="costume-bottom">
            <span class="availability-badge ${item.available ? 'badge-available' : 'badge-unavailable'}">
              ${item.available ? 'Available' : 'Rented'}
            </span>
            <span class="costume-price">${item.price}</span>
          </div>
        </div>
        <div class="wa-btn-wrap">
          <a href="https://wa.me/?text=Hi,%20I%20want%20to%20rent%20${encodeURIComponent(item.name)}" target="_blank" class="wa-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            Book via WhatsApp
          </a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// Function to Render Pagination Controls
function renderPagination() {
  pagination.innerHTML = '';
  const totalPages = Math.ceil(filteredItems.length / ITEMS_PER_PAGE);

  if (totalPages <= 1) return;

  // Previous Button
  const prevBtn = document.createElement('button');
  prevBtn.className = 'page-btn';
  prevBtn.innerText = '‹';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      updateUI();
    }
  });
  pagination.appendChild(prevBtn);

  // Page Number Buttons
  for (let i = 1; i <= totalPages; i++) {
    const pageBtn = document.createElement('button');
    pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
    pageBtn.innerText = i;
    pageBtn.addEventListener('click', () => {
      currentPage = i;
      updateUI();
    });
    pagination.appendChild(pageBtn);
  }

  // Next Button
  const nextBtn = document.createElement('button');
  nextBtn.className = 'page-btn';
  nextBtn.innerText = '›';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) {
      currentPage++;
      updateUI();
    }
  });
  pagination.appendChild(nextBtn);
}

function updateUI() {
  renderCostumes();
  renderPagination();
  window.scrollTo({ top: document.getElementById('costumeGrid').offsetTop - 100, behavior: 'smooth' });
}

// Filter Logic
function applyFilters() {
  const query = searchInput.value.toLowerCase();
  const activeCategory = document.querySelector('.cat-pill.active')?.dataset.category || 'all';

  filteredItems = costumeData.filter(item => {
    const matchesSearch = item.name.toLowerCase().includes(query);
    const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
    return matchesSearch && matchesCategory;
  });

  currentPage = 1;
  renderCostumes();
  renderPagination();
}

// Category Pill Event Listener
catFilter.addEventListener('click', (e) => {
  if (e.target.classList.contains('cat-pill')) {
    document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    applyFilters();
  }
});

// Search Input Event Listener
searchInput.addEventListener('input', applyFilters);

// Initial Load
renderCostumes();
renderPagination();
</script>

</body>
</html>
